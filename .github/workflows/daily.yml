# Reliable FREE daily digest — runs the worker directly against Neon, so it
# doesn't depend on the Render web service being awake.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL, APP_SECRET_KEY, SMTP_HOST, SMTP_PORT, SMTP_USERNAME,
#   SMTP_PASSWORD, FINDWORK_API_KEY, SERPAPI_API_KEY  (THEMUSE_API_KEY optional).
#
# Schedule is UTC. "0 6 * * *" = 08:00 Europe/Madrid in summer (07:00 in winter;
# GitHub cron does not follow DST). Trigger manually from the Actions tab too.
name: Daily digest
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[web]"
      - run: job-radar-worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          THEMUSE_API_KEY: ${{ secrets.THEMUSE_API_KEY }}
