# Render Blueprint: single free web service. Fully free (the web service sleeps
# after ~15 min idle and wakes on the next request — first load ~40s).
#
# Database: use a FREE, durable Neon Postgres (https://neon.tech) instead of
# Render's free Postgres (which is deleted after ~30 days). Create a Neon project,
# copy its connection string, and paste it as DATABASE_URL in the Render UI.
#
# Deploy: push to GitHub, then "New → Blueprint" in the Render dashboard.
# After the first deploy, set the secret env vars (marked sync:false) in the UI.
#
# Daily digest: Render Cron Jobs are PAID. On free, trigger the digest with a
# free external cron (e.g. cron-job.org) once a day:
#     GET https://<your-app>.onrender.com/tasks/run-daily?token=<CRON_TOKEN>
# Read CRON_TOKEN's generated value from the web service's Environment tab.
services:
  - type: web
    name: job-radar-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false # paste your Neon connection string (postgresql://...)
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CRON_TOKEN
        generateValue: true # used to authorize /tasks/run-daily
      - key: BASE_URL
        sync: false # e.g. https://job-radar-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: THEMUSE_API_KEY
        sync: false # optional
      - key: FINDWORK_API_KEY
        sync: false # optional
      - key: SERPAPI_API_KEY
        sync: false # optional
