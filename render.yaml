# Render Blueprint: web service + daily cron worker + Postgres.
# Deploy: push to GitHub, then "New → Blueprint" in the Render dashboard.
# After first deploy, set the secret env vars (marked sync:false) in the UI.
databases:
  - name: job-radar-db
    plan: free

services:
  - type: web
    name: job-radar-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-radar-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: BASE_URL
        sync: false # e.g. https://job-radar-web.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: THEMUSE_API_KEY
        sync: false # optional
      - key: FINDWORK_API_KEY
        sync: false # optional
      - key: SERPAPI_API_KEY
        sync: false # optional

  - type: cron
    name: job-radar-daily
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    schedule: "0 7 * * *" # 07:00 UTC daily
    dockerCommand: python -m job_radar.web.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: job-radar-db
          property: connectionString
      - key: APP_SECRET_KEY
        fromService:
          type: web
          name: job-radar-web
          envVarKey: APP_SECRET_KEY
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: THEMUSE_API_KEY
        sync: false # optional
      - key: FINDWORK_API_KEY
        sync: false # optional
      - key: SERPAPI_API_KEY
        sync: false # optional
